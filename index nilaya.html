                    <!-- Book 1: About Me -->

                        <div class="book-spine">
                            <div class="spine-line"></div>
                            <div class="spine-icon">

                                </svg>
                            </div>

                            <div class="spine-ornament">✦</div>
                        </div>
                    </div>

                    <!-- Book 2: Education -->
                    <div class="book book-maroon" data-book="education" tabindex="0" role="button" aria-label="Open Education Book">

                            <div class="spine-line"></div>

                                    <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
                                </svg>
                            </div>
                            <div class="spine-title">INTERESTS</div>
                            <div class="spine-ornament">✦</div>
                        </div>
                    </div>

                    <!-- Book 6: Contact Info -->

    <!-- Open Book Modal View -->

        <div class="book-modal-container">
            <button class="close-book-btn" id="closeBookBtn" aria-label="Close book">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
                <span>Put Back on Shelf</span>
            </button>

            <!-- Interactive 3D Open Book Container -->
            <div class="open-book" id="openBook">
                <!-- Left Page -->
                <div class="book-page page-left">
                    <div class="page-content" id="pageLeftContent">
                        <!-- Dynamic Content Loaded via JS -->
                    </div>
                    <div class="page-number left-num">1</div>
                </div>

                <!-- Book Binding Spine -->
                <div class="book-center-spine"></div>

                <!-- Right Page -->
                <div class="book-page page-right">
                    <div class="page-content" id="pageRightContent">
                        <!-- Dynamic Content Loaded via JS -->
                    </div>
                    <div class="page-number right-num">2</div>
                </div>
            </div>
        </div>

        <div class="handwritten-entry">
            <div class="book-header-badge">Book I</div>
            <h2 class="book-chapter-title">About Me</h2>
            <div class="cursive-text">
                <p class="greeting">Hello & welcome!</p>
                <p>
                    I am <strong>Nilaya Maurya</strong>, a first-year <strong>B.Tech CSE (Data Science)</strong> student with a deep-seated <strong>curiosity</strong> for understanding how data shapes the world around us.
                </p>
                <p>
                    My journey into technology is driven by a passion for <strong>problem solving</strong> and a growing fascination with <strong>Artificial Intelligence</strong>. I love diving into <strong>coding</strong>, building hands-on <strong>real-world projects</strong>, and exploring structured patterns in complex information.
                </p>
                <p>
                    Beyond academics, my background in martial arts has taught me that true growth comes from consistency and <strong>teamwork</strong>. The sharp <strong>sports discipline</strong> I built over years of training directly fuels my focus, resilience, and academic dedication every day.
                </p>
                <p class="signature-line">— Nilaya Maurya</p>
            </div>
        </div>
